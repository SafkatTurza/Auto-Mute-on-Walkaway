[package]
name = "amow-app"
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.75"
description = "Auto-Mute on Walkaway — desktop application shell"
default-run = "amow-app"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Tested logic crates from the workspace (this app crate is excluded from that
# workspace so `cargo test` there never pulls in the GUI toolchain).
amow-domain = { path = "../crates/domain" }
amow-config = { path = "../crates/config" }
amow-logger = { path = "../crates/logger" }
amow-eventbus = { path = "../crates/eventbus" }
amow-application = { path = "../crates/application" }
amow-adapters = { path = "../crates/adapters" }

[[bin]]
name = "amow-app"
path = "src/main.rs"

# Keep the release binary small and startup fast (mirrors the workspace profile).
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
